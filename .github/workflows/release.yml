name: release

# Reproducible release builds (AGENT-PLAN §2 AG4, §6 A5.1; README,
# "Releases").
#
# - A tag v<major>.<minor>.<patch>[-pre] builds that release and, if the
#   builds match, creates a DRAFT GitHub release with the unsigned
#   binaries and SHA256SUMS. The owner checks it, signs SHA256SUMS offline
#   (A5.2), adds the signature and publishes the release by hand.
# - Pull requests and pushes to main run the same builds and comparison as
#   a dry run, without a release.
#
# Every run builds twice from clean, on an amd64 and on an arm64 runner,
# from two checkout paths, with scripts/build-release (go.mod's toolchain,
# fresh build cache), and requires byte-identical binaries. Nothing here
# signs anything or holds a signing key; no secrets are used.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.builder }}, ${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - builder: a
            runner: ubuntu-26.04
            path: vettid-agent
          - builder: b
            runner: ubuntu-26.04-arm
            path: elsewhere/build-b/vettid-agent
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ${{ matrix.path }}
          # Tags, so that build-release finds the version tag on the commit.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ matrix.path }}/go.mod
          cache: false
      - name: build-release
        working-directory: ${{ matrix.path }}
        run: |
          uname -m
          go version
          scripts/build-release -o "$RUNNER_TEMP/out"
      - name: the devstack guard refuses a devstack build
        working-directory: ${{ matrix.path }}
        run: |
          export GOTOOLCHAIN="$(awk '$1 == "toolchain" { print $2 }' go.mod)"
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -tags devstack -o "$RUNNER_TEMP/devstack-build" ./cmd/vettid-agent
          "$RUNNER_TEMP/devstack-build" version
          if out="$(scripts/check-release-binaries "$RUNNER_TEMP/devstack-build" 2>&1)"; then
            echo "::error::check-release-binaries accepted a devstack build"; exit 1
          fi
          echo "$out"
          echo "$out" | grep -q 'built with the devstack tag'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-${{ matrix.builder }}
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
          retention-days: 30

  compare:
    needs: build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-a
          path: ${{ runner.temp }}/a
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-b
          path: ${{ runner.temp }}/b
      - name: the two builds are identical
        env:
          A: ${{ runner.temp }}/a
          B: ${{ runner.temp }}/b
        run: |
          set -x
          diff -u "$A/SHA256SUMS" "$B/SHA256SUMS"
          diff <(cd "$A" && ls -A) <(cd "$B" && ls -A)
          (cd "$A" && sha256sum -c SHA256SUMS)
          for f in "$A"/vettid-agent-*; do cmp "$f" "$B/$(basename "$f")"; done
      - name: summary
        env:
          A: ${{ runner.temp }}/a
        run: |
          {
            echo "### Release build of \`$GITHUB_SHA\`"
            echo
            echo "Two clean builds (amd64 and arm64 runners) are byte-identical."
            echo
            echo '```'
            cat "$A/SHA256SUMS"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

  draft:
    # Only for a version tag: a DRAFT release, published by the owner after
    # adding the offline signature over SHA256SUMS.
    needs: compare
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-a
          path: release
      - name: draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          # build-release named the files after the tag it found on the
          # commit; they must carry this tag.
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::tag $TAG is not v<major>.<minor>.<patch>[-pre]"; exit 1
          fi
          for f in release/vettid-agent-*; do
            case "$(basename "$f")" in
              "vettid-agent-$TAG-"*) ;;
              *) echo "::error::$f is not named for $TAG"; exit 1 ;;
            esac
          done
          cat >notes.md <<EOF
          vettid-agent $TAG, built from \`$GITHUB_SHA\` by [run $GITHUB_RUN_ID]($GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID).

          Unsigned draft. Rebuild and compare with \`scripts/verify-reproducible $TAG SHA256SUMS\` (README, "Releases").
          EOF
          gh release create "$TAG" --repo "$REPO" --draft --verify-tag --title "vettid-agent $TAG" --notes-file notes.md \
            release/vettid-agent-* release/SHA256SUMS
