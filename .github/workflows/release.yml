name: release

# Reproducible release builds and the owner's signature (AGENT-PLAN §2
# AG4, §6 A5; README, "Releases"; docs/RELEASING.md).
#
# - A tag v<major>.<minor>.<patch>[-pre] builds that release and, if the
#   builds match and the tag is annotated, signed with a key in main's
#   release/allowed_signers (scripts/verify-tag) and GitHub verified,
#   creates a DRAFT GitHub release with the unsigned binaries and
#   SHA256SUMS. The owner then runs scripts/sign-release on their own
#   machine: it rebuilds and compares, adds the notarized macOS app, signs
#   SHA256SUMS with the release key, uploads the signature and publishes.
# - A published release is checked once more: SHA256SUMS.sig must verify
#   against main's release/allowed_signers and every asset must match SHA256SUMS
#   (the "signature" job), or the run fails.
# - Pull requests and pushes to main run the same builds and comparison as
#   a dry run, without a release.
#
# Every run builds twice from clean, on an amd64 and on an arm64 runner,
# from two checkout paths, with scripts/build-release (go.mod's toolchain,
# fresh build cache), and requires byte-identical binaries. Builder a
# gets go.mod's Go from actions/setup-go; builder b does not use
# setup-go: it uses the runner image's Go only to download go.mod's
# toolchain module (golang.org/toolchain) from the Go module proxy, verified
# against the Go checksum database, into an empty module cache (the
# module the go command itself fetches when it switches toolchains). The
# two toolchains reach the runners by different paths. Nothing here
# signs anything or holds a signing key, an Apple certificate or
# notarization credentials; no secrets are used. Windows Authenticode
# signing is deferred by the owner (2026-10-18) until the business entity
# exists.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # The owner publishes with their own token (scripts/sign-release), so
  # publishing starts this workflow.
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.builder }}, ${{ matrix.runner }})
    if: github.event_name != 'release'
    strategy:
      fail-fast: false
      matrix:
        include:
          - builder: a
            runner: ubuntu-26.04
            path: vettid-agent
            setup-go: true
          - builder: b
            runner: ubuntu-26.04-arm
            path: elsewhere/build-b/vettid-agent
            setup-go: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ${{ matrix.path }}
          # Tags, so that build-release finds the version tag on the commit.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.setup-go
        with:
          go-version-file: ${{ matrix.path }}/go.mod
          cache: false
      - name: go.mod's toolchain from the Go module proxy, checksum-verified
        if: ${{ !matrix.setup-go }}
        working-directory: ${{ matrix.path }}
        run: |
          set -euo pipefail
          if ! command -v go >/dev/null; then
            # The image's preinstalled Go, newest first; it only fetches the toolchain.
            gobin="$(ls -d /opt/hostedtoolcache/go/*/*/bin 2>/dev/null | sort -V | tail -n1)"
            [ -n "$gobin" ] || { echo "::error::no Go on this runner image"; exit 1; }
            export PATH="$gobin:$PATH"
          fi
          tc="$(awk '$1 == "toolchain" { print $2 }' go.mod)"
          mod="golang.org/toolchain@v0.0.1-$tc.linux-$(cd / && GOTOOLCHAIN=local go env GOHOSTARCH)"
          # The same module the go command fetches when it switches
          # toolchains, into an empty module cache; `go mod download`
          # checks it against the Go checksum database (GOSUMDB).
          export GOMODCACHE="$RUNNER_TEMP/gomodcache" GOFLAGS=-modcacherw
          json="$(cd / && GOTOOLCHAIN=local GOSUMDB=sum.golang.org go mod download -json "$mod")" || { echo "$json"; echo "::error::could not download $mod"; exit 1; }
          echo "$json"
          dir="$(printf '%s' "$json" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("Dir") or "")')"
          if [ -z "$dir" ] || [ ! -d "$dir" ] || [ ! -f "$dir/bin/go" ] || [ -z "$(ls -A "$dir/pkg/tool" 2>/dev/null)" ]; then
            echo "::error::the downloaded toolchain $mod is missing or empty (dir: \"$dir\")"; exit 1
          fi
          # Module zips carry no execute bits; the go command sets them
          # on bin/ and pkg/tool/ when it switches, and so does this step.
          chmod +x "$dir"/bin/* "$dir"/pkg/tool/*/*
          echo "$dir/bin" >>"$GITHUB_PATH"
          echo "GOMODCACHE=$GOMODCACHE" >>"$GITHUB_ENV"
          "$dir/bin/go" version
      - name: build-release
        working-directory: ${{ matrix.path }}
        env:
          # A version tag builds as that tag; everything else as "untagged".
          REF: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'HEAD' }}
        run: |
          uname -m
          command -v go
          (cd / && GOTOOLCHAIN=local go version)
          scripts/build-release -o "$RUNNER_TEMP/out" "$REF"
      - name: the version rule (local tags in a throwaway clone, never pushed)
        if: matrix.builder == 'a'
        working-directory: ${{ matrix.path }}
        run: |
          set -euo pipefail
          # Two version tags on one commit: each builds as itself, and
          # HEAD builds as untagged.
          c="$RUNNER_TEMP/version-rule"
          git clone --quiet --no-local . "$c"
          commit="$(git -C "$c" rev-parse HEAD)"
          git -C "$c" tag v0.0.0-rc.1
          git -C "$c" -c user.name=ci -c user.email=ci@invalid tag -a -m "version rule check" v0.0.0
          for v in v0.0.0 v0.0.0-rc.1 untagged; do
            ref="$v"; [ "$v" = untagged ] && ref=HEAD
            "$c/scripts/build-release" -o "$RUNNER_TEMP/vr-$v" "$ref" >/dev/null
            names="$(cd "$RUNNER_TEMP/vr-$v" && ls vettid-agent-* | tr '\n' ' ')"
            want="vettid-agent-$v-linux-amd64 vettid-agent-$v-linux-arm64 vettid-agent-$v-windows-amd64.exe "
            [ "$names" = "$want" ] || { echo "::error::$ref built [$names], want [$want]"; exit 1; }
            # shellcheck disable=SC2086 # names is a list of file names
            (cd "$RUNNER_TEMP/vr-$v" && "$c/scripts/check-release-binaries" -v "$v" -c "$commit" $names)
            got="$("$RUNNER_TEMP/vr-$v/vettid-agent-$v-linux-amd64" version | head -n2)"
            [ "$got" = "$(printf 'vettid-agent %s\ncommit: %s' "$v" "$commit")" ] || { echo "::error::$ref: version says $got"; exit 1; }
            echo "$ref builds as $v"
          done
      - name: the devstack guard refuses a devstack build
        working-directory: ${{ matrix.path }}
        run: |
          export GOTOOLCHAIN="$(awk '$1 == "toolchain" { print $2 }' go.mod)"
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -tags devstack -o "$RUNNER_TEMP/devstack-build" ./cmd/vettid-agent
          "$RUNNER_TEMP/devstack-build" version
          if out="$(scripts/check-release-binaries "$RUNNER_TEMP/devstack-build" 2>&1)"; then
            echo "::error::check-release-binaries accepted a devstack build"; exit 1
          fi
          echo "$out"
          echo "$out" | grep -q 'built with the devstack tag'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-${{ matrix.builder }}
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
          retention-days: 30

  compare:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-a
          path: ${{ runner.temp }}/a
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-b
          path: ${{ runner.temp }}/b
      - name: the two builds are identical
        env:
          A: ${{ runner.temp }}/a
          B: ${{ runner.temp }}/b
        run: |
          set -x
          diff -u "$A/SHA256SUMS" "$B/SHA256SUMS"
          diff <(cd "$A" && ls -A) <(cd "$B" && ls -A)
          (cd "$A" && sha256sum -c SHA256SUMS)
          for f in "$A"/vettid-agent-*; do cmp "$f" "$B/$(basename "$f")"; done
      - name: summary
        env:
          A: ${{ runner.temp }}/a
        run: |
          {
            echo "### Release build of \`$GITHUB_SHA\`"
            echo
            echo "Two clean builds (amd64 and arm64 runners) are byte-identical."
            echo
            echo '```'
            cat "$A/SHA256SUMS"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

  draft:
    # Only for a version tag: a DRAFT release, published by the owner with
    # scripts/sign-release after adding the signature over SHA256SUMS.
    needs: compare
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Two checks of the tag's signature. GitHub's "verified" alone accepts
      # a signature by any key GitHub knows for the tagger's account (any
      # SSH or GPG signing key, or a web-flow signature), not only the
      # release key; so the tag is also checked with scripts/verify-tag (an
      # SSH signature, and only that, by a listed key) against main's
      # release/allowed_signers, not the tagged commit's copy (which the
      # tag itself could change). verify-tag here is the tag's own copy, so
      # this is a consistency check; the controls are scripts/sign-release
      # and scripts/verify-release run from main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src
          persist-credentials: false
      - name: the release tag is signed with a key in main's release/allowed_signers
        working-directory: src
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --quiet --no-tags --force origin "+refs/tags/$TAG:refs/tags/$TAG" "+refs/heads/main:refs/remotes/origin/main"
          [ "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$GITHUB_SHA" ] || { echo "::error::$TAG is not $GITHUB_SHA"; exit 1; }
          git show origin/main:release/allowed_signers >"$RUNNER_TEMP/allowed_signers"
          scripts/verify-tag -a "$RUNNER_TEMP/allowed_signers" "$TAG" || { echo "::error::$TAG is not signed with a key in main's release/allowed_signers (docs/RELEASING.md: merge the key line before tagging; delete and re-make a tag pushed earlier)"; exit 1; }
      - name: the release tag is signed (GitHub verified)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          obj="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha')"
          read -r type sha <<<"$obj"
          if [ "$type" != tag ]; then echo "::error::$TAG is a lightweight tag; release tags are annotated and signed"; exit 1; fi
          verified="$(gh api "repos/$REPO/git/tags/$sha" --jq '.verification.verified')"
          reason="$(gh api "repos/$REPO/git/tags/$sha" --jq '.verification.reason')"
          if [ "$verified" != true ]; then echo "::error::$TAG's signature is not verified by GitHub ($reason)"; exit 1; fi
          echo "$TAG: signed, verified ($reason)"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-a
          path: release
      - name: draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          # build-release was given this tag and named the files after it.
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::tag $TAG is not v<major>.<minor>.<patch>[-pre]"; exit 1
          fi
          for f in release/vettid-agent-*; do
            case "$(basename "$f")" in
              "vettid-agent-$TAG-"*) ;;
              *) echo "::error::$f is not named for $TAG"; exit 1 ;;
            esac
          done
          cat >notes.md <<EOF
          vettid-agent $TAG, built from \`$GITHUB_SHA\` by [run $GITHUB_RUN_ID]($GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID).

          Unsigned draft. The owner signs and publishes it with \`scripts/sign-release $TAG\` (docs/RELEASING.md); rebuild and compare with \`scripts/verify-reproducible $TAG SHA256SUMS\` (README, "Releases").
          EOF
          gh release create "$TAG" --repo "$REPO" --draft --verify-tag --title "vettid-agent $TAG" --notes-file notes.md \
            release/vettid-agent-* release/SHA256SUMS

  signature:
    # A published release: the owner's signature over SHA256SUMS and every
    # asset against it, with main's release/allowed_signers (and the tag's
    # own verify-release: a consistency check; users and the owner run
    # main's scripts/verify-release). Fails
    # loudly if the signature is missing or does not verify; it cannot
    # unpublish (no write permission), so the owner acts on the failure.
    if: github.event_name == 'release'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: SHA256SUMS.sig verifies, and every asset matches SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/release"
          mkdir -p "$dir"
          git fetch --quiet --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          git show origin/main:release/allowed_signers >"$RUNNER_TEMP/allowed_signers"
          gh release download "$TAG" --repo "$REPO" -D "$dir"
          ls -l "$dir"
          if [ ! -f "$dir/SHA256SUMS.sig" ]; then
            echo "::error::$TAG is published without SHA256SUMS.sig: make it a draft again (gh release edit $TAG --draft) and run scripts/sign-release $TAG"
            exit 1
          fi
          # Every asset is listed: verify-release fails on an unlisted
          # vettid-agent-$TAG-* file; anything else is refused here.
          for f in "$dir"/*; do
            case "$(basename "$f")" in
              SHA256SUMS | SHA256SUMS.sig | "vettid-agent-$TAG-"*) ;;
              *) echo "::error::$TAG has an asset that is not part of a release: $(basename "$f")"; exit 1 ;;
            esac
          done
          if ! scripts/verify-release -a "$RUNNER_TEMP/allowed_signers" -c "$GITHUB_SHA" -A -l "$dir" "$TAG"; then
            echo "::error::$TAG is published, but its signature or files do not verify (above): make it a draft again and run scripts/sign-release $TAG"
            exit 1
          fi
          {
            echo "### vettid-agent \`$TAG\`: signed"
            echo
            echo '```'
            cat "$dir/SHA256SUMS"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
