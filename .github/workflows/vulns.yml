name: vulns

# The weekly vulnerability scan. It reports; it never changes a dependency.
#
# govulncheck v1.9.0 over the module, with the Go of go.mod: fails only on a
# vulnerability the code reaches; -show verbose also names those in
# imported packages and required modules that the code doesn't call. Pull
# requests and pushes to main are already scanned by ci.yml's govulncheck
# job; this run catches advisories published after the last change.
#
# Weekly and on demand. On main, a run with a finding opens one issue, or
# comments on the one already open; a clean run closes it.
#
# Actions are pinned by commit SHA (tag in the comment).

on:
  schedule:
    - cron: '17 6 * * 1' # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: govulncheck v1.9.0
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -show verbose ./...

  issue:
    # One issue for all findings: opened, or commented on while open; a
    # clean run closes it.
    if: always() && github.ref == 'refs/heads/main'
    needs: [govulncheck]
    runs-on: ubuntu-26.04
    permissions:
      issues: write
    steps:
      - name: open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GOVULN: ${{ needs.govulncheck.result }}
        run: |
          what=""
          if [ "$GOVULN" != success ]; then
            what="
          - govulncheck: a vulnerability the code reaches, or the scan could not run (the job log names it)."
          fi
          title="security: vulnerability scan findings"
          n=$(gh issue list --state open --search "in:title \"$title\"" --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$what" ]; then
            if [ -n "$n" ]; then
              gh issue comment "$n" --body "Found again: $RUN$what"
            else
              gh issue create --title "$title" --body "The weekly vulnerability scan on main (.github/workflows/vulns.yml) found:$what

          See $RUN."
            fi
          elif [ -n "$n" ]; then
            gh issue close "$n" --comment "Clean on main: $RUN"
          fi
