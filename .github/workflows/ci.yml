name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            race: "-race"
          - os: macos-15
            race: "-race"
          # The race detector needs cgo; the Windows runner builds without it.
          - os: windows-2025
            race: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go mod verify
        run: go mod verify
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ${{ matrix.race }} -count=1 ./...
      # The DPAPI tests again, verbose, as the record of what Windows
      # answered. Only this step creates local test users and runs a helper
      # as them (internal/protect/dpapi_otheruser_windows_test.go), so that
      # happens once per run.
      - name: DPAPI tests, verbose, with test users
        if: runner.os == 'Windows'
        env:
          VETTID_AGENT_TEST_OTHER_USER: "1"
        run: go test -count=1 -v -run "TestDPAPI|TestChooseProtectorWindows|TestClassifyDPAPI" ./internal/protect
      # The Keychain tests again, verbose, as the record of what macOS
      # answers a binary without the keychain-access-groups entitlement
      # (a test binary is one); the round trip needs the signed app (A5).
      - name: Keychain tests, verbose
        if: runner.os == 'macOS'
        run: go test -count=1 -v -run "Keychain|TestChooseProtectorDarwin|TestCanonicalDir" ./internal/protect
      # The devstack build (vettid-vault's local dev stack; never a
      # release): vetted, and its unit tests run. The dev-stack tests
      # themselves need a running stack and skip with -short.
      - name: devstack build, vet and unit tests
        if: runner.os == 'Linux'
        run: |
          go vet -tags devstack ./...
          go test -tags devstack -short -count=1 ./internal/devstack ./internal/pairing ./cmd/vettid-agent
      - name: build and run
        shell: bash
        run: |
          bin="./vettid-agent-ci$(go env GOEXE)"
          go build -o "$bin" ./cmd/vettid-agent
          "$bin" version

  govulncheck:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: govulncheck v1.9.0
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  shellcheck:
    # Pinned, checksum-verified binary (the release's published sha256).
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install shellcheck v0.11.0 (checksum-verified)
        run: |
          curl -sSLo sc.tgz https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.gz
          echo "b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6  sc.tgz" | sha256sum -c -
          tar -xzf sc.tgz shellcheck-v0.11.0/shellcheck
      - name: shellcheck scripts/
        run: ./shellcheck-v0.11.0/shellcheck --version && ./shellcheck-v0.11.0/shellcheck scripts/*

  gitleaks:
    # Pinned binary over the full history (the gitleaks action fails on a
    # branch's first push, where there is no "before" commit). Known false
    # positives in the retired code's history are listed in .gitleaksignore.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: install gitleaks v8.30.1 (checksum-verified)
        run: |
          curl -sSLo gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks
      - name: scan full history
        run: ./gitleaks git --redact --verbose .
