name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -o vettid-agent ./cmd/vettid-agent

      - name: Test
        run: go test -race -v ./...

      - name: Verify binary runs
        run: |
          ./vettid-agent version
          ./vettid-agent init --help
          ./vettid-agent start --help
