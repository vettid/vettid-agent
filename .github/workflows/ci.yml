name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            race: "-race"
          - os: macos-15
            race: "-race"
          # The race detector needs cgo; the Windows runner builds without it.
          - os: windows-2025
            race: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      # User-facing text is American English (owner decision, 2026-11-05).
      - name: spelling (American English in user-facing text)
        if: runner.os == 'Linux'
        run: sh scripts/check-spelling
      - name: go mod verify
        run: go mod verify
      - name: go vet
        run: go vet ./...
      # On Windows, a test binary that crashes outside Go's handler (as
      # internal/state's did once, 0xc0000005) leaves a full dump here,
      # kept as an artifact below. Only this module's test binaries
      # (<package>.test.exe, as go test names them) are dumped, through
      # per-program keys, which match an executable's base name, so the
      # same test binaries run by later steps (some as throwaway users)
      # are dumped too; not the service the probes register (probe.exe)
      # nor anything else on the runner. A dump holds no more than a
      # test's own throwaway data.
      - name: keep crash dumps of the test binaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps'
          $dir = Join-Path $env:RUNNER_TEMP 'dumps'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $pkgs = go list ./...
          if ($LASTEXITCODE) { exit 1 }
          foreach ($p in $pkgs) {
            $k = Join-Path $base (($p -split '/')[-1] + '.test.exe')
            New-Item -Force $k | Out-Null
            Set-ItemProperty $k -Name DumpFolder -Value $dir -Type ExpandString
            Set-ItemProperty $k -Name DumpType -Value 2 -Type DWord
            Set-ItemProperty $k -Name DumpCount -Value 5 -Type DWord
          }
          Get-ChildItem $base | Select-Object -ExpandProperty PSChildName
      - name: go test
        env:
          # wer: a traceback as crash gives, but leaving Windows Error Reporting
          # on (crash sets SEM_NOGPFAULTERRORBOX, so no dump would be written).
          GOTRACEBACK: ${{ runner.os == 'Windows' && 'wer' || 'single' }}
        run: go test ${{ matrix.race }} -count=1 ./...
      # The DPAPI tests again, verbose, as the record of what Windows
      # answered. Only this step creates local test users and runs a helper
      # as them (internal/protect/dpapi_otheruser_windows_test.go), so that
      # happens once per run.
      - name: DPAPI tests, verbose, with test users
        if: runner.os == 'Windows'
        env:
          VETTID_AGENT_TEST_OTHER_USER: "1"
        run: go test -count=1 -v -run "TestDPAPI|TestChooseProtectorWindows|TestClassifyDPAPI" ./internal/protect
      # The local channel's tests with other accounts (AGENT-PLAN A3.10a):
      # another user, an administrator who is not the member, a squatter,
      # the configuration file read as the member, an elevated pair end to
      # end through the real configuration file. They make throwaway
      # local users, only in this step, which fails unless each passed.
      - name: channel tests, verbose, with test users
        if: runner.os == 'Windows'
        shell: bash
        env:
          VETTID_AGENT_TEST_OTHER_USER: "1"
        run: |
          set -o pipefail
          go test -count=1 -v ./internal/channel | tee "$RUNNER_TEMP/channel.txt"
          go test -count=1 -v -run "TestElevated|TestStubOverPipe" ./cmd/vettid-agent | tee -a "$RUNNER_TEMP/channel.txt"
          for t in TestOtherUserRefused TestAdminWhoIsNotTheMember TestSquatterRefused TestReadPipeAdminOnly \
                   TestAppContainerRefused TestPipeRemoteRefused TestPipeRejectRemoteFlag TestPipeAnonymousRefused \
                   TestTokenIdentityElevation TestPipeFailedInstanceKeepsName TestPipeBusy \
                   TestElevatedPairEndToEnd TestStubOverPipe; do
            grep -q -- "--- PASS: $t " "$RUNNER_TEMP/channel.txt" || { echo "::error::$t did not pass"; exit 1; }
          done
      # The channel's Unix-socket end as root (AGENT-PLAN A5.6): throwaway
      # users and groups and a transient systemd socket unit, removed in
      # cleanup. The step fails unless each root test passed (not skipped).
      - name: channel tests as root, with test users and a systemd socket
        if: runner.os == 'Linux'
        run: |
          set -o pipefail
          # Built as releases are (scripts/build-release): without cgo, so
          # os/user reads /etc/passwd and /etc/group as it will there.
          CGO_ENABLED=0 go test -c -o "$RUNNER_TEMP/channel.test" ./internal/channel
          sudo VETTID_TEST_LINUX_ROOT=1 "$RUNNER_TEMP/channel.test" -test.run '^TestRoot' -test.count=1 -test.v -test.timeout=300s | tee "$RUNNER_TEMP/channel-root.txt"
          for t in TestRootChannel TestRootMemberIsAdmin TestRootHeldAdminGroup TestRootClientRefusesImpostors TestRootNotStarved; do
            grep -q -- "--- PASS: $t " "$RUNNER_TEMP/channel-root.txt" || { echo "::error::$t did not pass"; exit 1; }
          done
      # AGENT-PLAN A3.10b's first check, measured: what a virtual service
      # account (NT SERVICE\<name>) holds, and how it can start a program
      # as a runner, in five variants. It registers a throwaway service and two
      # users, checks what is known, prints what the service recorded, and
      # removes them.
      - name: service account probe, verbose
        if: runner.os == 'Windows'
        shell: bash
        env:
          VETTID_AGENT_TEST_OTHER_USER: "1"
        run: |
          set -o pipefail
          go test -count=1 -v -run 'TestServiceAccountProbe$' ./internal/service | tee "$RUNNER_TEMP/probe.txt"
          for t in default cut3 cut3+grant2 cut2+grant1 cut1 cut1-seclogon-stopped; do t="TestServiceAccountProbe/$t"
            grep -q -- "--- PASS: $t " "$RUNNER_TEMP/probe.txt" || { echo "::error::$t did not pass"; exit 1; }
          done
      # A3.10b's second measurement, for the owner's decision B: the
      # launcher hop, the image check, a window station and desktop of
      # the run's own, DCOM with INTERACTIVE deny-only, inheritance, and
      # B's runner shape. A throwaway service, users and class, removed
      # afterwards.
      - name: runner hop probe, verbose
        if: runner.os == 'Windows'
        shell: bash
        env:
          VETTID_AGENT_TEST_OTHER_USER: "1"
        run: |
          set -o pipefail
          go test -count=1 -v -timeout 30m -run 'TestRunnerHopProbe$' ./internal/service | tee "$RUNNER_TEMP/probe2.txt"
          for t in hop route-a shapes seclogon-disabled; do t="TestRunnerHopProbe/$t"
            grep -q -- "--- PASS: $t " "$RUNNER_TEMP/probe2.txt" || { echo "::error::$t did not pass"; exit 1; }
          done
      # internal/state's tests crashed once on Windows with an access
      # violation (0xc0000005) and no Go trace. Run 10 more times,
      # verbosely, with GOTRACEBACK=wer, so a crash says where; the
      # whole output is kept as an artifact.
      - name: internal/state repeated, verbose (crash hunt)
        # It runs whatever an earlier step did, so a flaky test there
        # doesn't hide it.
        if: runner.os == 'Windows' && !cancelled()
        shell: bash
        env:
          GOTRACEBACK: wer
        run: |
          set -o pipefail
          go test -c -o "$RUNNER_TEMP/state.test.exe" ./internal/state
          ok=0
          for i in $(seq 1 10); do
            if ! (cd internal/state && "$RUNNER_TEMP/state.test.exe" -test.v -test.count=1 > "$RUNNER_TEMP/state-$i.txt" 2>&1); then
              echo "::error::run $i failed"
              tail -n 80 "$RUNNER_TEMP/state-$i.txt"
              ok=1
            fi
          done
          exit $ok
      - name: keep the crash hunt's output
        if: runner.os == 'Windows' && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: state-crash-hunt
          path: ${{ runner.temp }}/state-*.txt
          retention-days: 7
          if-no-files-found: ignore
      # The runner's user is an administrator, for whom every folder can be
      # changed, so internal/run's on-disk access checks skip in "go test"
      # above. Here the package's tests run again as a new standard user,
      # and the step fails if any of them skipped as elevated.
      - name: internal/run as a standard user
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'runtest'
          $tmp = Join-Path $env:RUNNER_TEMP 'runtest-tmp'
          New-Item -ItemType Directory -Force $dir, $tmp | Out-Null
          go test -c -o (Join-Path $dir 'run.test.exe') ./internal/run
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $name = 'vettidrunci'
          $pw = [Convert]::ToBase64String([Security.Cryptography.RandomNumberGenerator]::GetBytes(18)) + 'aA1!'
          $sec = ConvertTo-SecureString $pw -AsPlainText -Force
          New-LocalUser -Name $name -Password $sec -AccountNeverExpires | Out-Null
          $failed = $null
          try {
            # The test binary's folder readable, and a temporary folder of
            # the user's own: Start-Process -Credential passes this
            # environment, whose TEMP the user can't write.
            icacls $dir /grant "${name}:(OI)(CI)RX" | Out-Null
            icacls $tmp /grant "${name}:(OI)(CI)M" | Out-Null
            sc.exe config seclogon start= demand | Out-Null
            sc.exe start seclogon | Out-Null
            $cred = New-Object Management.Automation.PSCredential($name, $sec)
            $out = Join-Path $env:RUNNER_TEMP 'runtest-out.txt'
            $err = Join-Path $env:RUNNER_TEMP 'runtest-err.txt'
            $exe = Join-Path $dir 'run.test.exe'
            $cmdline = "/c set TMP=$tmp&& set TEMP=$tmp&& `"$exe`" -test.v -test.count=1"
            $p = Start-Process -FilePath "$env:SystemRoot\System32\cmd.exe" -ArgumentList $cmdline `
              -Credential $cred -LoadUserProfile -WorkingDirectory $dir `
              -RedirectStandardOutput $out -RedirectStandardError $err -PassThru
            $null = $p.Handle # kept, so ExitCode is readable after the exit
            $p.WaitForExit()
            Get-Content $out, $err
            if ($p.ExitCode -ne 0) { $failed = "internal/run failed as a standard user (exit $($p.ExitCode))" }
            elseif (Select-String -Path $out -Pattern 'running as an administrator' -Quiet) {
              $failed = "a test skipped as elevated under the standard user"
            }
            elseif (-not (Select-String -Path $out -Pattern '--- PASS: TestAccessCheckIsReal' -Quiet)) {
              $failed = "TestAccessCheckIsReal did not pass"
            }
          } finally {
            try { Remove-LocalUser -Name $name } catch { Write-Warning "removing ${name}: $_" }
          }
          if ($failed) { Write-Error $failed }
          exit 0
      # The Keychain tests again, verbose, as the record of what macOS
      # answers a binary without the keychain-access-groups entitlement
      # (a test binary is one); the round trip needs the signed app (A5).
      - name: Keychain tests, verbose
        if: runner.os == 'macOS'
        run: go test -count=1 -v -run "Keychain|TestChooseProtectorDarwin|TestCanonicalDir" ./internal/protect
      # The macOS app bundle as scripts/sign-release builds it, signed ad
      # hoc: no Developer ID, provisioning profile or notarization in CI
      # (the owner signs and notarizes on their Mac, docs/RELEASING.md).
      - name: macOS app bundle (ad hoc)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          scripts/build-macos-app -o "$RUNNER_TEMP/app" HEAD
          app="$RUNNER_TEMP/app/vettid-agent.app"
          find "$app" -print
          plutil -p "$app/Contents/Info.plist"
          codesign --verify --strict --verbose=2 "$app"
          codesign -d --verbose=2 "$app" 2>&1 | grep -E 'Identifier=org.vettid.agent|flags=.*runtime'
          "$app/Contents/MacOS/vettid-agent" version
          # With a made-up team ID: the entitlements it would be signed with.
          # Not run: without a provisioning profile macOS stops it at launch.
          scripts/build-macos-app -o "$RUNNER_TEMP/app-team" -t ABCDE12345 HEAD
          codesign -d --entitlements - --xml "$RUNNER_TEMP/app-team/vettid-agent.app" >"$RUNNER_TEMP/ent.xml"
          plutil -p "$RUNNER_TEMP/ent.xml"
          grep -q 'ABCDE12345.org.vettid.agent' "$RUNNER_TEMP/ent.xml"
          if grep -q TEAMID "$RUNNER_TEMP/ent.xml"; then echo "::error::TEAMID left in the entitlements"; exit 1; fi
          # A real identity needs the team ID and the profile.
          if scripts/build-macos-app -o "$RUNNER_TEMP/app-x" -s "Developer ID Application" HEAD 2>"$RUNNER_TEMP/err"; then
            echo "::error::build-macos-app signed with an identity but no team ID or profile"; exit 1
          fi
          grep -q 'needs the team ID' "$RUNNER_TEMP/err"
      - name: release signature scripts
        if: runner.os != 'Windows'
        env:
          # On macOS: verify-release's app check runs on the ad-hoc app
          # built above.
          VETTID_TEST_MACOS_APP: ${{ runner.os == 'macOS' && format('{0}/app/vettid-agent.app', runner.temp) || '' }}
        run: |
          scripts/test-release-signing
          scripts/test-sign-release
      # The devstack build (vettid-vault's local dev stack; never a
      # release): vetted, and its unit tests run. The dev-stack tests
      # themselves need a running stack and skip with -short.
      - name: devstack build, vet and unit tests
        if: runner.os == 'Linux'
        run: |
          go vet -tags devstack ./...
          go test -tags devstack -short -count=1 ./internal/devstack ./internal/pairing ./cmd/vettid-agent
      - name: build and run
        shell: bash
        run: |
          bin="./vettid-agent-ci$(go env GOEXE)"
          go build -o "$bin" ./cmd/vettid-agent
          "$bin" version
      # Last, so a dump from any Windows step above (the crash hunt
      # included) is kept.
      - name: keep any crash dump (Windows)
        if: runner.os == 'Windows' && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crash-dumps
          path: ${{ runner.temp }}/dumps
          retention-days: 7
          if-no-files-found: ignore

  govulncheck:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: govulncheck v1.9.0
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  shellcheck:
    # Pinned, checksum-verified binary (the release's published sha256).
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install shellcheck v0.11.0 (checksum-verified)
        run: |
          curl -sSLo sc.tgz https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.gz
          echo "b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6  sc.tgz" | sha256sum -c -
          tar -xzf sc.tgz shellcheck-v0.11.0/shellcheck
      - name: shellcheck scripts/
        run: ./shellcheck-v0.11.0/shellcheck --version && ./shellcheck-v0.11.0/shellcheck scripts/*

  gitleaks:
    # Pinned binary over the full history (the gitleaks action fails on a
    # branch's first push, where there is no "before" commit). Known false
    # positives in the retired code's history are listed in .gitleaksignore.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: install gitleaks v8.30.1 (checksum-verified)
        run: |
          curl -sSLo gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks
      - name: scan full history
        run: ./gitleaks git --redact --verbose .
